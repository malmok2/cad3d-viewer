<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" role="img" aria-label="CAD 3D Viewer v1.0.0">
  <!-- 연구실 홈페이지용 배너. build_viewer.py 가 1.0.0 을 채워 docs/banner.svg 로 쓴다.
       글꼴은 내장하지 않고 시스템 폰트 스택에 맡긴다 (배너 SVG 가 2 MB 가 되면 곤란). -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6f9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4c81" stop-opacity=".22"/><stop offset="1" stop-color="#0f4c81" stop-opacity=".08"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#181f2a" flood-opacity=".14"/>
    </filter>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#181f2a" flood-opacity=".16"/>
    </filter>
  </defs>
  <!-- 패널: 테두리 없이 그림자 + 위쪽 하이라이트 -->
  <rect x="6" y="6" width="348" height="84" rx="18" fill="url(#panel)" filter="url(#sh)"/>
  <rect x="6.5" y="6.5" width="347" height="1" rx=".5" fill="#ffffff" opacity=".9"/>

  <!-- 아이콘 (icon.svg 와 같은 그림, 64px) -->
  <g transform="translate(18 16) scale(0.6667)">
    <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#bg)" filter="url(#sh2)"/>
    <g fill="none" stroke="#0f4c81" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M48 18 L72 31 L48 44 L24 31 Z"/>
      <path d="M24 31 V57 L48 70 V44"/>
      <path d="M72 31 V57 L48 70"/>
      <path d="M24 57 L48 44 L72 57" stroke-width="1.6" stroke-opacity=".35"/>
    </g>
    <path d="M30 38 L66 30 L66 52 L30 60 Z" fill="url(#cut)" stroke="#0f4c81" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/>
    <g fill="none" stroke="#15181c" stroke-width="1.8" stroke-linecap="round">
      <path d="M31 78 H65"/><path d="M24 73.5 V82.5 M72 73.5 V82.5"/>
    </g>
    <path d="M24 78 L32.5 74.6 V81.4 Z M72 78 L63.5 74.6 V81.4 Z" fill="#15181c"/>
  </g>

  <!-- 글 -->
  <g font-family="'Pretendard Variable',Pretendard,'Noto Sans KR','Malgun Gothic','Segoe UI',Arial,sans-serif">
    <text x="98" y="42" font-size="19" font-weight="700" fill="#15181c" letter-spacing="-0.3">CAD 3D Viewer</text>
    <text x="98" y="63" font-size="12" font-weight="500" fill="#22262b">형상 확인 · 정면샷 · 치수 · 단면</text>
    <!-- 버전 태그 -->
    <rect x="282.0" y="27" width="58.0" height="20" rx="7" fill="#0f4c81" fill-opacity=".11"/>
    <text x="311.0" y="41" font-size="11.5" font-weight="600" fill="#0f4c81" text-anchor="middle" letter-spacing=".3">v1.0.0</text>
    <!-- 열기 화살표 -->
    <text x="98" y="80" font-size="11" font-weight="600" fill="#0f4c81">브라우저에서 바로 열기 →</text>
  </g>
</svg>
